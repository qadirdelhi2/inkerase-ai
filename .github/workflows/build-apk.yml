name: Build InkErase Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html style.css app.js manifest.json icon-512.png fonts mediapipe sw.js qr_code.png www/ 2>/dev/null || cp -r index.html style.css app.js manifest.json icon-512.png fonts mediapipe www/

      - name: Install Dependencies & Init Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor-community/media@latest @capacitor/filesystem@latest @capacitor/share@latest
          npx cap add android
          npx cap sync

      - name: Configure Android Gallery Permissions
        run: |
          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              perms = '''
    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />
</manifest>'''
              content = content.replace('</manifest>', perms)
              content = content.replace('<application', '<application android:requestLegacyExternalStorage=\"true\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Successfully injected MediaStore gallery permissions into AndroidManifest.xml')
          "

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} InkErase-AI.apk \;
          ls -lh InkErase-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InkErase-AI-APK
          path: InkErase-AI.apk
